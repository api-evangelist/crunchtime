aid: crunchtime

name: Crunchtime

description: Crunchtime (CrunchTime! Information Systems) is an AI-powered restaurant operations management platform used by 850+ multi-unit restaurant
  brands across 150,000+ locations to run inventory and food-cost control, labor and scheduling, operations execution (tasks, audits, temperature
  and food-prep labeling), kitchen display (KDS), guest/host-stand management, learning & development, and operational intelligence (Crunchtime
  Insights and Data Streaming). For integrators, Crunchtime publishes the Inventory & Labor developer hub — a REST/JSON API of 150+ operations
  (employees, locations, budgets, recipes, purchase orders, inventory counts, schedules, sales/menu-mix and more) served from the net-chef.com
  web services, authenticated with per-environment API tokens plus a site name and application user. The company merged with QSR Automations to
  cover the full restaurant food lifecycle and is a Battery Ventures portfolio company.

