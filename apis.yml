apis:
- aid: crunchtime:crunchtime-inventory-labor-api
  name: Crunchtime Inventory & Labor API
  description: >-
    The Crunchtime Inventory & Labor API is a REST/JSON web-services API for integrating restaurant back-office
    data with the Crunchtime platform. It exposes 150+ operations organized by functional area — Employees/Locations/Users,
    Financial Operations, Inventory, Labor & scheduling, Point-of-Sale / Sales (menu mix), Vendors/Purchasing,
    and other services — each following a get-all / get-by-page / save pattern. Requests are authenticated
    with a per-environment authentication token together with the customer site name, application user
    id and password, and are served from the net-chef.com web services host (separate test and production
    hosts).
  humanURL: https://developer.crunchtime.com/docs/introduction
  baseURL: https://webservices.net-chef.com
  tags:
  - Inventory
  - Labor
  - Scheduling
  - Purchasing
  - Recipes
  - Point-of-Sale
  - Restaurant
